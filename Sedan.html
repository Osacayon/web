<!DOCTYPE html>
<html lang="es">
<head>

    <title>LINEA SEDAN</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .button {
            background-color: #f44336;
            color: white;

            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;

        }

        .button a {
            text-decoration: none;
            color: white;
        }

        .button:hover {
            background-color: #d32f2f;
        }
    </style>
