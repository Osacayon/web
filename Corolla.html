<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COROLLA</title>
    <link rel="stylesheet" href="styles.css"> 
    <style>
        .button {
            background-color: #f44336;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }

        .button a {
            text-decoration: none;
            color: white;
        }

        .button:hover {
            background-color: #d32f2f;
        }

        .comprar {
            background-color: #FFD700;
            color: black;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
        }

        .comprar a {
            text-decoration: none;
            color: black;
        }

        .comprar:hover {
            background-color: #FFC107;
        }

        .vehicle img {
            width: 200px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <header class="header">
        <button class="button">
            <a href="toyota.html" class="volver">VOLVER</a>
        </button>
        <h1 class="title">COROLLA</h1>
    </header>

    <main>
        <h2 style="text-align: center; color: #FFD700;">VERSIÓN AUTOMÁTICA</h2>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px; background-color: rgba(0, 0, 0, 0.8); border-radius: 10px;">
            <div class="vehicle" style="text-align: center;">
                <img src="imagenes/COROLLA LE BLANCO.png" alt="Corolla Blanco">
                <h3 style="margin: 10px 0; font-size: 1.2rem; color: #FFD700;">COROLLA LE BLANCO</h3>
                <p style="color: white;">Transmisión: Automática</p>
                <p style="color: white;">Precio: Q250,000</p>
                <button class="comprar">
                    <a href="formulario.html">Comprar</a>
                </button>
            </div>
            <div class="vehicle" style="text-align: center;">
                <img src="imagenes/corolla-gr-color-negro.jpg" alt="Corolla GR">
                <h3 style="margin: 10px 0; font-size: 1.2rem; color: #FFD700;">COROLLA GR</h3>
                <p style="color: white;">Transmisión: Automática</p>
                <p style="color: white;">Precio: Q350,000</p>
                <button class="comprar">
                    <a href="formulario.html">Comprar</a>
                </button>
            </div>
            <div class="vehicle" style="text-align: center;">
                <img src="imagenes/corolla sport.png" alt="Corolla Sport">
                <h3 style="margin: 10px 0; font-size: 1.2rem; color: #FFD700;">COROLLA SPORT</h3>
                <p style="color: white;">Transmisión: Automática</p>
                <p style="color: white;">Precio: Q300,000</p>
                <button class="comprar">
                    <a href="formulario.html">Comprar</a>
                </button>
            </div>
        </div>

        <h2 style="text-align: center; color: #FFD700;">VERSIÓN HÍBRIDA</h2>
        <div style="display: grid; grid-template-columns: repeat(1, 1fr); gap: 20px; padding: 20px; background-color: rgba(0, 0, 0, 0.8); border-radius: 10px;">
            <div class="vehicle" style="text-align: center;">
                <img src="imagenes/Colores-Corolla-2020-azul-oscuro.jpg" alt="Corolla Híbrido">
                <h3 style="margin: 10px 0; font-size: 1.2rem; color: #FFD700;">COROLLA HÍBRIDO</h3>
                <p style="color: white;">Transmisión: Automática</p>
                <p style="color: white;">Precio: Q255,000</p>
                <button class="comprar">
                    <a href="formulario.html">Comprar</a>
                </button>
            </div>
        </div>
    </main>
</body>
</html>
